# Builds lolcommits.app (macOS universal, signed + notarized when the Apple
# secrets are set) and Linux packages for every version tag like 0.3.0.
name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libclang-dev libv4l-dev

      - name: Apple signing and notarization
        # only when the secrets exist; otherwise the build is unsigned
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application: entrecode GmbH (MAMAYY5H8H)"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=MAMAYY5H8H"
          } >> "$GITHUB_ENV"

      - name: Install
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app/src-tauri
        run: |
          mkdir -p resources && cp ../../lolcommits ../../PRIVACY.md resources/
          LOLCOMMITS_TEST_PATTERN=1 cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: lolcommits ${{ github.ref_name }}
          releaseBody: Download lolcommits.dmg (macOS) or the .AppImage / .deb (Linux), open it and follow the setup.
          releaseDraft: true
          args: ${{ matrix.args }}
