# Builds lolcommits.app (macOS universal, signed + notarized when the Apple
# secrets are set) and Linux packages for every version tag like 0.3.0.
name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft release with the notes from CHANGELOG.md; both builds upload into it.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ github.ref_name }}
        run: |
          awk -v v="$V" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          printf '\n**Download:** the `.dmg` for macOS (Apple Silicon and Intel), the `.AppImage` or `.deb` for Linux. Open it and follow the setup.\n' >> notes.md
          gh release create "$V" --draft --verify-tag --title "lolcommits $V" --notes-file notes.md
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$V\") | .id" | head -1)" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    # also runs without a tag (workflow_dispatch), then it only builds
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libclang-dev libv4l-dev

      - name: Apple signing and notarization
        # only when the secrets exist; otherwise the build is unsigned.
        # Secrets come in via env, so no value is pasted into the script.
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ID: ${{ secrets.APPLE_ID }}
          PW: ${{ secrets.APPLE_PASSWORD }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application: entrecode GmbH (MAMAYY5H8H)"
            echo "APPLE_ID=$ID"
            echo "APPLE_PASSWORD=$PW"
            echo "APPLE_TEAM_ID=MAMAYY5H8H"
          } >> "$GITHUB_ENV"

      - name: Install
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app/src-tauri
        run: |
          mkdir -p resources && cp ../../lolcommits ../../PRIVACY.md resources/
          LOLCOMMITS_TEST_PATTERN=1 cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}
